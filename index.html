          this.player.invulnerableTimer = 1.8;
          if (this.map.currentRoom && this.map.currentRoom.enemies) {
            this.map.currentRoom.enemies.forEach(e => e.resetActivationGrace(1.2));
          }

          const mid = Math.floor(GRID_SIZE / 2);
          this.player.x = mid * TILE_SIZE + TILE_SIZE / 2;
          this.player.y = mid * TILE_SIZE + TILE_SIZE / 2;
          this.player.isRecoiling = false;
          this.player.recoilVx = 0;
          this.player.recoilVy = 0;
          this.player.animState = 'idle';

          this.updateHUD();
        };
      }

      checkGoelaDeposit() {
        const room = this.map.currentRoom;
        if (!room.hasGoela || (this.player.chronoCores || 0) <= 0) return;

        const pGridX = Math.floor(this.player.x / TILE_SIZE);
        const pGridY = Math.floor(this.player.y / TILE_SIZE);

        if (pGridX >= 0 && pGridX < GRID_SIZE && pGridY >= 0 && pGridY < GRID_SIZE) {
          if (room.grid[pGridY][pGridX] === TILE.GOELA) {
            const deposited = this.player.chronoCores;
            this.player.chronoCores = 0;
            this.player.depositedCores = (this.player.depositedCores || 0) + deposited;
            sound.playChuteDeposit();
            showToast(`DEPOSITADO: ${deposited} CC NA GOELA!`);
            this.spawnSparks(this.player.x, this.player.y, '#4caf50', 30);
            this.spawnSparks(this.player.x, this.player.y, '#00e5ff', 25);
            this.spawnFloatingText(`+${deposited} CC DEPOSITADO`, this.player.x, this.player.y - 18, '#4caf50');
            this.updateHUD();
          }
        }
      }

      spawnFloatingText(text, x, y, color = '#ffffff') {
        this.floatingTexts.push({
          text,
          x,
          y,
          color,
          life: 0.9,
          maxLife: 0.9
        });
      }

      landThrownBomb(bomb) {
        const gridX = Math.floor(bomb.targetX / TILE_SIZE);
        const gridY = Math.floor(bomb.targetY / TILE_SIZE);

        if (bomb.type === BOMB_TYPE.IMPACT) {
          sound.playImpactExplosion();
          this.detonateImpact(bomb.targetX, bomb.targetY, gridX, gridY);
        } else if (bomb.type === BOMB_TYPE.PROPULSOR) {
          sound.playPropulsorSteam();
          this.detonatePropulsor(bomb.targetX, bomb.targetY);
        } else if (bomb.type === BOMB_TYPE.TIMED) {
          sound.playTimedBeep(1.0);
          this.timedBombs.push(new TimedBomb(gridX, gridY));
        }
      }

      detonateImpact(cx, cy, gridX, gridY) {
        const room = this.map.currentRoom;
        const blastRadius = TILE_SIZE * 1.5;
        this.blasts.push(new ExplosionBlast(cx, cy, blastRadius, false));
        this.spawnSparks(cx, cy, '#ff5252', 25);

        // Destrói blocos quebráveis no raio 3x3 e dropa CC (taxa escala com a profundidade)
        const depth = this.map.currentDepth || 1;
        const dropChance = Math.min(0.85, 0.50 + (depth - 1) * 0.10);

        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            const tx = gridX + dx;
            const ty = gridY + dy;
            if (tx >= 0 && tx < GRID_SIZE && ty >= 0 && ty < GRID_SIZE) {
              if (room.grid[ty][tx] === TILE.BREAKABLE) {
                room.grid[ty][tx] = TILE.EMPTY;
                const spawnX = tx * TILE_SIZE + TILE_SIZE / 2;
                const spawnY = ty * TILE_SIZE + TILE_SIZE / 2;
                this.spawnDebris(spawnX, spawnY);

                // Probabilidade de cair CC (Chrono Core) aumentando com a profundidade
                if (Math.random() < dropChance) {
                  this.ccDrops.push(new ChronoCoreDrop(spawnX, spawnY));
                  this.spawnSparks(spawnX, spawnY, '#00e5ff', 10);
                  if (depth >= 3 && Math.random() < 0.35) {
                    this.ccDrops.push(new ChronoCoreDrop(spawnX + 6, spawnY + 4));
                  }
                }
              }
            }
          }
        }

        // Se a explosão atingir o nodo de chão do andar inferior, inicia animação de quebra!
        if (room.secretFloorNode && room.secretFloorNode.state === 'intact') {
          const distToNode = Math.hypot(cx - room.secretFloorNode.x, cy - room.secretFloorNode.y);
          if (distToNode <= blastRadius + 10) {
            room.secretFloorNode.triggerBreak(this);
          }
        }

        // Causa 1 de dano nos autômatos no raio da explosão de impacto
        for (let i = room.enemies.length - 1; i >= 0; i--) {
          const enemy = room.enemies[i];
          const dist = Math.hypot(enemy.x - cx, enemy.y - cy);
          if (dist <= blastRadius + enemy.radius) {
            const isDead = enemy.takeDamage(1, this);
            if (isDead) {
              this.spawnEnemyDeath(enemy.x, enemy.y);
              room.enemies.splice(i, 1);
            } else {
              const knockX = dist > 0.001 ? (enemy.x - cx) / dist : 1;
              const knockY = dist > 0.001 ? (enemy.y - cy) / dist : 0;
              enemy.applyRepulsion(knockX, knockY, 220);
            }
          }
        }
      }

      detonatePropulsor(cx, cy) {
        const room = this.map.currentRoom;
        this.blasts.push(new ExplosionBlast(cx, cy, TILE_SIZE * 2.2, false));
        this.spawnSparks(cx, cy, '#00e5ff', 30);

        // Se Charlotte estiver no raio da explosão, sofre recuo (dash) para longe
        const pDist = Math.hypot(this.player.x - cx, this.player.y - cy);
        if (pDist < TILE_SIZE * 2.8) {
          let pushX = this.player.x - cx;
          let pushY = this.player.y - cy;
          if (Math.hypot(pushX, pushY) < 0.001) {
            pushX = -this.player.facing.dx;
            pushY = -this.player.facing.dy;
          }
          const norm = Math.hypot(pushX, pushY) || 1;
          this.player.applyImpulse(pushX / norm, pushY / norm, 3.0);
        }

        // Empurra inimigos para longe (não causa dano, apenas repulsão)
        const repelRadius = TILE_SIZE * 3.5;
        room.enemies.forEach(enemy => {
          const dx = enemy.x - cx;
          const dy = enemy.y - cy;
          const dist = Math.hypot(dx, dy);
          if (dist < repelRadius) {
            const nx = dist > 0.001 ? dx / dist : 1;
            const ny = dist > 0.001 ? dy / dist : 0;
            enemy.applyRepulsion(nx, ny, 380);
          }
        });
      }

      detonateTimedBomb(bomb) {
        const room = this.map.currentRoom;
        sound.playBigTimedExplosion();
        const bx = bomb.x;
        const by = bomb.y;
        const crossRange = 2; // Cruz de 2 blocos
        const depth = this.map.currentDepth || 1;
        const dropChance = Math.min(0.85, 0.50 + (depth - 1) * 0.10);

        this.blasts.push(new ExplosionBlast(bx, by, TILE_SIZE * (crossRange + 0.5), true));
        this.spawnSparks(bx, by, '#ffca28', 40);

        const affectedTiles = [{ x: bomb.gridX, y: bomb.gridY }];
        const dirs = [{ dx: 1, dy: 0 }, { dx: -1, dy: 0 }, { dx: 0, dy: 1 }, { dx: 0, dy: -1 }];

        dirs.forEach(d => {
          for (let step = 1; step <= crossRange; step++) {
            const tx = bomb.gridX + d.dx * step;
            const ty = bomb.gridY + d.dy * step;
            if (tx >= 0 && tx < GRID_SIZE && ty >= 0 && ty < GRID_SIZE) {
              affectedTiles.push({ x: tx, y: ty });
              if (room.grid[ty][tx] === TILE.WALL) break;
            }
          }
        });

        // Destrói caixas/blocos quebráveis na área e dropa CC
        affectedTiles.forEach(tile => {
          const currentTile = room.grid[tile.y][tile.x];
          if (currentTile === TILE.BREAKABLE) {
            room.grid[tile.y][tile.x] = TILE.EMPTY;
            const spawnX = tile.x * TILE_SIZE + TILE_SIZE / 2;
            const spawnY = tile.y * TILE_SIZE + TILE_SIZE / 2;
            this.spawnDebris(spawnX, spawnY);

            // Probabilidade de cair CC aumentando com a profundidade
            if (Math.random() < dropChance) {
              this.ccDrops.push(new ChronoCoreDrop(spawnX, spawnY));
              this.spawnSparks(spawnX, spawnY, '#00e5ff', 10);
              if (depth >= 3 && Math.random() < 0.35) {
                this.ccDrops.push(new ChronoCoreDrop(spawnX + 6, spawnY + 4));
              }
            }
          }
        });

        // Se a explosão em cruz atingir o nodo de chão do andar inferior, inicia animação de quebra!
        if (room.secretFloorNode && room.secretFloorNode.state === 'intact') {
          const distToNode = Math.hypot(bx - room.secretFloorNode.x, by - room.secretFloorNode.y);
          if (distToNode <= TILE_SIZE * (crossRange + 0.6)) {
            room.secretFloorNode.triggerBreak(this);
          }
        }

        // Causa 2 de dano nos Inimigos na cruz (Bomba pesada)
        for (let i = room.enemies.length - 1; i >= 0; i--) {
          const enemy = room.enemies[i];
          const ex = enemy.x;
          const ey = enemy.y;

          let hit = false;
          for (const tile of affectedTiles) {
            const tileCenterX = tile.x * TILE_SIZE + TILE_SIZE / 2;
            const tileCenterY = tile.y * TILE_SIZE + TILE_SIZE / 2;
            if (Math.hypot(ex - tileCenterX, ey - tileCenterY) < TILE_SIZE * 0.85) {
              hit = true;
              break;
            }
          }

          if (hit) {
            const isDead = enemy.takeDamage(2, this);
            if (isDead) {
              this.spawnEnemyDeath(enemy.x, enemy.y);
              room.enemies.splice(i, 1);
            } else {
              const knockX = enemy.x - bx !== 0 ? Math.sign(enemy.x - bx) : 1;
              const knockY = enemy.y - by !== 0 ? Math.sign(enemy.y - by) : 0;
              enemy.applyRepulsion(knockX, knockY, 280);
            }
          }
        }
      }

      checkRoomTransitions() {
        if (this.fadeState !== 'none') return;
        const room = this.map.currentRoom;
        if (room.isLockdown) return;

        const mid = Math.floor(GRID_SIZE / 2);
        const px = this.player.x;
        const py = this.player.y;

        if (room.doors.north && py < TILE_SIZE * 0.5 && Math.abs(px - (mid * TILE_SIZE + TILE_SIZE / 2)) < TILE_SIZE) {
          this.switchRoom(room.rx, room.ry - 1, 'north');
        } else if (room.doors.south && py > WORLD_HEIGHT - TILE_SIZE * 0.5 && Math.abs(px - (mid * TILE_SIZE + TILE_SIZE / 2)) < TILE_SIZE) {
          this.switchRoom(room.rx, room.ry + 1, 'south');
        } else if (room.doors.west && px < TILE_SIZE * 0.5 && Math.abs(py - (mid * TILE_SIZE + TILE_SIZE / 2)) < TILE_SIZE) {
          this.switchRoom(room.rx - 1, room.ry, 'west');
        } else if (room.doors.east && px > WORLD_WIDTH - TILE_SIZE * 0.5 && Math.abs(py - (mid * TILE_SIZE + TILE_SIZE / 2)) < TILE_SIZE) {
          this.switchRoom(room.rx + 1, room.ry, 'east');
        }
      }

      switchRoom(targetRx, targetRy, exitDirection) {
        const nextRoom = this.map.getRoom(targetRx, targetRy);
        if (!nextRoom) return;

        this.fadeState = 'out';
        this.pendingTransition = () => {
          this.map.currentRoom = nextRoom;
          nextRoom.visited = true;
          this.player.invulnerableTimer = 0.6;
          // Concede tempo de carência para todos os autômatos da nova sala
          nextRoom.enemies.forEach(e => e.resetActivationGrace(1.2));

          const mid = Math.floor(GRID_SIZE / 2);
          const offset = TILE_SIZE * 1.5;

          if (exitDirection === 'north') {
            this.player.x = mid * TILE_SIZE + TILE_SIZE / 2;
            this.player.y = WORLD_HEIGHT - offset;
          } else if (exitDirection === 'south') {
            this.player.x = mid * TILE_SIZE + TILE_SIZE / 2;
            this.player.y = offset;
          } else if (exitDirection === 'west') {
            this.player.x = WORLD_WIDTH - offset;
            this.player.y = mid * TILE_SIZE + TILE_SIZE / 2;
          } else if (exitDirection === 'east') {
            this.player.x = offset;
            this.player.y = mid * TILE_SIZE + TILE_SIZE / 2;
          }

          this.timedBombs = [];
        };
      }

      checkHoleFall() {
        if (this.fadeState !== 'none') return;
        const room = this.map.currentRoom;
        if (room.isSecret) return;

        const pGridX = Math.floor(this.player.x / TILE_SIZE);
        const pGridY = Math.floor(this.player.y / TILE_SIZE);

        if (room.grid[pGridY][pGridX] === TILE.HOLE) {
          this.fadeState = 'out';
          sound.playChuteDeposit();
          showToast('QUEDA: ANDAR INFERIOR SECRETO!');

          this.pendingTransition = () => {
            this.map.secretRoom.returnRoom = room;
            this.map.currentRoom = this.map.secretRoom;
            this.player.invulnerableTimer = 0.6;
            this.map.secretRoom.enemies.forEach(e => e.resetActivationGrace(1.2));

            this.player.x = Math.floor(GRID_SIZE / 2) * TILE_SIZE + TILE_SIZE / 2;
            this.player.y = TILE_SIZE * 2;
          };
        }
      }

      checkSecretLadder() {
        if (this.fadeState !== 'none') return;
        const room = this.map.currentRoom;
        if (!room.isSecret) return;

        const pGridX = Math.floor(this.player.x / TILE_SIZE);
        const pGridY = Math.floor(this.player.y / TILE_SIZE);

        if (room.grid[pGridY][pGridX] === TILE.SECRET_LADDER) {
          this.fadeState = 'out';
          sound.playUnlockSound();
          showToast('RETORNANDO À SUPERFÍCIE...');

          this.pendingTransition = () => {
            const returnRoom = room.returnRoom || this.map.rooms.get(`${this.map.startRoomCoords.x},${this.map.startRoomCoords.y}`);
            this.map.currentRoom = returnRoom;
            this.player.invulnerableTimer = 0.6;
            returnRoom.enemies.forEach(e => e.resetActivationGrace(1.2));
            this.player.x = Math.floor(GRID_SIZE / 2) * TILE_SIZE + TILE_SIZE / 2;
            this.player.y = Math.floor(GRID_SIZE / 2) * TILE_SIZE + TILE_SIZE / 2;
          };
        }
      }

      triggerTimeRewind() {
        sound.playRewindGlitch();
        this.rewindGlitchTimer = 0.5;
        this.player.invulnerableTimer = 1.8;
        showToast('TEMPO REBOBINADO: NOVO MAPA GERADO!');

        this.fadeState = 'out';
        this.pendingTransition = () => {
          // 1. Gera um novo mapa procedural completo
          this.map.generateWorld();

          // 2. Limpa bombas em voo, bombas no chão, partículas e drops soltos
          this.timedBombs = [];
          this.flyingBombs = [];
          this.ccDrops = [];
          this.floatingTexts = [];
          this.particles = [];
          this.blasts = [];

          // 3. Reseta CCs não depositados da corrida atual (mantém depositados salvos)
          this.player.chronoCores = 0;

          // 4. Posiciona Charlotte no centro da nova sala inicial
          const mid = Math.floor(GRID_SIZE / 2);
          this.player.x = mid * TILE_SIZE + TILE_SIZE / 2;
          this.player.y = mid * TILE_SIZE + TILE_SIZE / 2;
          this.player.isRecoiling = false;
          this.player.recoilVx = 0;
          this.player.recoilVy = 0;
          this.player.animState = 'idle';

          // 5. Inimigos da sala inicial (se houver) recebem carência de ativação
          if (this.map.currentRoom && this.map.currentRoom.enemies) {
            this.map.currentRoom.enemies.forEach(e => e.resetActivationGrace(1.2));
          }

          // 6. Atualiza o HUD para exibir as novas coordenadas e contadores
          this.updateHUD();
        };
      }

      spawnSparks(x, y, color, count) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 180 + 40;
          this.particles.push(new Particle(
            x, y,
            Math.cos(angle) * speed,
            Math.sin(angle) * speed,
            color,
            Math.random() * 4 + 2,
            Math.random() * 0.4 + 0.2
          ));
        }
      }

      spawnDebris(x, y) {
        for (let i = 0; i < 14; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 120 + 30;
          this.particles.push(new Particle(
            x, y,
            Math.cos(angle) * speed,
            Math.sin(angle) * speed,
            '#8d6e63',
            Math.random() * 5 + 3,
            Math.random() * 0.5 + 0.3
          ));
        }
      }

      spawnEnemyDeath(x, y) {
        for (let i = 0; i < 20; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 160 + 50;
          this.particles.push(new Particle(
            x, y,
            Math.cos(angle) * speed,
            Math.sin(angle) * speed,
            '#ef5350',
            Math.random() * 4 + 2,
            Math.random() * 0.4 + 0.2
          ));
        }
      }

      render() {
        const ctx = this.ctx;
        const room = this.map.currentRoom;

        ctx.clearRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

        // Chão base com Spritesheet da Mina (chao_mina.png - Células 64x64)
        const hasChaoSprite = this.chaoSprite && this.chaoSprite.complete && this.chaoSprite.naturalWidth > 0;

        for (let y = 0; y < GRID_SIZE; y++) {
          for (let x = 0; x < GRID_SIZE; x++) {
            const px = x * TILE_SIZE;
            const py = y * TILE_SIZE;

            if (hasChaoSprite) {
              // Se este ladrilho for o nodo secreto integrado ao chão, renderiza seu frame correspondente
              if (room.secretFloorNode && room.secretFloorNode.gridX === x && room.secretFloorNode.gridY === y) {
                const node = room.secretFloorNode;
                const frame = CHAO_FRAMES[node.frameIndex] || CHAO_FRAMES[2];
                ctx.drawImage(this.chaoSprite, frame.sx, frame.sy, 64, 64, px, py, TILE_SIZE, TILE_SIZE);
              } else {
                // Variação orgânica usando as 3 primeiras imagens de chão normal (Frames 0, 1, 2)
                const tileHash = (x * 37 + y * 59 + (room.rx || 0) * 101 + (room.ry || 0) * 131) % 100;
                let frameIdx = 0;
                if (tileHash < 68) frameIdx = 0;      // Piso padrão limpo
                else if (tileHash < 90) frameIdx = 1; // Fissura leve
                else frameIdx = 2;                    // Rachadura detalhada

                const frame = CHAO_FRAMES[frameIdx];
                ctx.drawImage(this.chaoSprite, frame.sx, frame.sy, 64, 64, px, py, TILE_SIZE, TILE_SIZE);
              }
            } else {
              ctx.fillStyle = room.isSecret ? '#141820' : '#1c212a';
              ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            }
          }
        }

        // Grade arquitetônica sutil
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.035)';
        ctx.lineWidth = 1;
        for (let i = 0; i <= GRID_SIZE; i++) {
          ctx.beginPath();
          ctx.moveTo(i * TILE_SIZE, 0);
          ctx.lineTo(i * TILE_SIZE, WORLD_HEIGHT);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(0, i * TILE_SIZE);
          ctx.lineTo(WORLD_WIDTH, i * TILE_SIZE);
          ctx.stroke();
        }

        const now = performance.now() / 1000;

        // Efeitos Visuais adicionais no Nodo Secreto de Acesso ao Andar Inferior
        if (room.secretFloorNode) {
          const node = room.secretFloorNode;
          if (node.state === 'breaking') {
            const shake = (Math.random() - 0.5) * 4;
            ctx.save();
            ctx.strokeStyle = '#ff7043';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(node.x - 14 + shake, node.y - 14);
            ctx.lineTo(node.x + 14, node.y + 14 + shake);
            ctx.moveTo(node.x + 14 + shake, node.y - 14);
            ctx.lineTo(node.x - 14, node.y + 14 + shake);
            ctx.stroke();
            ctx.restore();
          } else if (node.state === 'opened') {
            const pulse = (Math.sin(now * 6) + 1) / 2;
            ctx.save();
            // Aura de energia abissal azul-cianeto pulsante ao redor da cratera
            ctx.strokeStyle = `rgba(0, 229, 255, ${0.45 + pulse * 0.45})`;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(node.x, node.y, TILE_SIZE * 0.38 + pulse * 3, 0, Math.PI * 2);
            ctx.stroke();

            // Seta luminosa indicando descida para o andar inferior
            ctx.fillStyle = `rgba(0, 229, 255, ${0.75 + pulse * 0.25})`;
            ctx.font = 'bold 13px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('▼', node.x, node.y + Math.sin(now * 8) * 3);
            ctx.restore();
          }
        }

        // Renderização de Elementos do Grid (Paredes, Caixas Quebráveis, Portas, Goela)
        for (let y = 0; y < GRID_SIZE; y++) {
          for (let x = 0; x < GRID_SIZE; x++) {
            const tile = room.grid[y][x];
            const px = x * TILE_SIZE;
            const py = y * TILE_SIZE;

            if (tile === TILE.WALL) {
              // Paredes Fixas (Indestrutíveis): Rocha e metal reforçado
              ctx.fillStyle = '#21262d';
              ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
              ctx.strokeStyle = '#30363d';
              ctx.lineWidth = 2;
              ctx.strokeRect(px + 1, py + 1, TILE_SIZE - 2, TILE_SIZE - 2);

              ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
              ctx.fillRect(px + 2, py + 2, TILE_SIZE - 4, 3);
            } else if (tile === TILE.BREAKABLE) {
              // Caixa de Madeira / Minério Quebrável (Tem chance de dropar CC)
              ctx.fillStyle = '#5d4037';
              ctx.fillRect(px + 1, py + 1, TILE_SIZE - 2, TILE_SIZE - 2);

              // Painel de tábuas de madeira
              ctx.fillStyle = '#8d6e63';
              ctx.fillRect(px + 4, py + 4, TILE_SIZE - 8, TILE_SIZE - 8);

              // Travessas de reforço de madeira (X)
              ctx.strokeStyle = '#4e342e';
              ctx.lineWidth = 2.5;
              ctx.beginPath();
              ctx.moveTo(px + 5, py + 5);
              ctx.lineTo(px + TILE_SIZE - 5, py + TILE_SIZE - 5);
              ctx.moveTo(px + TILE_SIZE - 5, py + 5);
              ctx.lineTo(px + 5, py + TILE_SIZE - 5);
              ctx.stroke();

              // Moldura externa escura
              ctx.strokeStyle = '#3e2723';
              ctx.lineWidth = 2;
              ctx.strokeRect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4);

              // Cantoneiras metálicas de proteção
              ctx.fillStyle = '#37474f';
              ctx.fillRect(px + 2, py + 2, 6, 6);
              ctx.fillRect(px + TILE_SIZE - 8, py + 2, 6, 6);
              ctx.fillRect(px + 2, py + TILE_SIZE - 8, 6, 6);
              ctx.fillRect(px + TILE_SIZE - 8, py + TILE_SIZE - 8, 6, 6);

              // Brilho interno azulado sutil indicando possibilidade de Chrono Core
              const crateGlow = (Math.sin(now * 3 + x * 2 + y * 3) + 1) / 2;
              ctx.fillStyle = `rgba(0, 229, 255, ${0.2 + crateGlow * 0.35})`;
              ctx.beginPath();
              ctx.arc(px + TILE_SIZE / 2, py + TILE_SIZE / 2, 4, 0, Math.PI * 2);
              ctx.fill();
            } else if (tile === TILE.LOCK_GATE) {
              // Lockdown: Blocos Vermelhos Piscantes
              const pulse = (Math.sin(now * 10) + 1) / 2;
              ctx.fillStyle = `rgba(239, 83, 80, ${0.4 + pulse * 0.6})`;
              ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
              ctx.strokeStyle = '#ff1744';
              ctx.lineWidth = 2;
              ctx.strokeRect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4);

              ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
              ctx.beginPath();
              ctx.moveTo(px + 6, py + TILE_SIZE - 6);
              ctx.lineTo(px + TILE_SIZE - 6, py + 6);
              ctx.stroke();
            } else if (tile === TILE.HOLE) {
              // Buraco / Abismo aberto
              if (hasChaoSprite) {
                const f = CHAO_FRAMES[6];
                ctx.drawImage(this.chaoSprite, f.sx, f.sy, 64, 64, px, py, TILE_SIZE, TILE_SIZE);
              } else {
                ctx.fillStyle = '#08090c';
                ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
              }
              const pulse = (Math.sin(now * 5) + 1) / 2;
              ctx.strokeStyle = `rgba(0, 229, 255, ${0.35 + pulse * 0.35})`;
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              ctx.arc(px + TILE_SIZE / 2, py + TILE_SIZE / 2, 12, 0, Math.PI * 2);
              ctx.stroke();
            } else if (tile === TILE.GOELA) {
              // Goela (Depósito de Chrono Cores): Duto Verde Escuro com borda pulsante
              const pulse = (Math.sin(now * 4) + 1) / 2;
              ctx.fillStyle = '#1b5e20';
              ctx.beginPath();
              ctx.arc(px + TILE_SIZE / 2, py + TILE_SIZE / 2, TILE_SIZE * 0.42, 0, Math.PI * 2);
              ctx.fill();

              ctx.strokeStyle = `rgba(76, 175, 80, ${0.7 + pulse * 0.3})`;
              ctx.lineWidth = 3;
              ctx.stroke();

              ctx.fillStyle = '#0d3311';
              ctx.beginPath();
              ctx.arc(px + TILE_SIZE / 2, py + TILE_SIZE / 2, 9, 0, Math.PI * 2);
              ctx.fill();

              // Ícone ou texto do duto coletor
              ctx.fillStyle = '#81c784';
              ctx.font = 'bold 10px sans-serif';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText('GOELA', px + TILE_SIZE / 2, py + TILE_SIZE / 2);
            } else if (tile === TILE.SECRET_LADDER) {
              // Escada de retorno da sala secreta
              ctx.fillStyle = '#37474f';
              ctx.fillRect(px + 8, py, TILE_SIZE - 16, TILE_SIZE);
              ctx.strokeStyle = '#90a4ae';
              ctx.lineWidth = 3;
              for (let ly = 6; ly < TILE_SIZE; ly += 8) {
                ctx.beginPath();
                ctx.moveTo(px + 10, py + ly);
                ctx.lineTo(px + TILE_SIZE - 10, py + ly);
                ctx.stroke();
              }
            } else if (tile === TILE.GAUNTLET_ITEM) {
              // Pedestal de Upgrade da Manopla Mecânica
              ctx.fillStyle = '#212733';
              ctx.fillRect(px + 4, py + 4, TILE_SIZE - 8, TILE_SIZE - 8);
              ctx.strokeStyle = '#ffd700';
              ctx.lineWidth = 2;
              ctx.strokeRect(px + 4, py + 4, TILE_SIZE - 8, TILE_SIZE - 8);

              const pulseGlow = (Math.sin(now * 6) + 1) / 2;
              ctx.fillStyle = `rgba(255, 215, 0, ${0.15 + pulseGlow * 0.25})`;
              ctx.fillRect(px + 6, py + 6, TILE_SIZE - 12, TILE_SIZE - 12);

              ctx.font = '18px sans-serif';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText('🥊', px + TILE_SIZE / 2, py + TILE_SIZE / 2);
            }
          }
        }

        // Bombas Temporizadas
        this.timedBombs.forEach(bomb => {
          ctx.save();
          // Quadrado Amarelo
          ctx.fillStyle = bomb.isBlinkingRed ? '#ef5350' : '#ffca28';
          ctx.fillRect(bomb.x - 12, bomb.y - 12, 24, 24);
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.strokeRect(bomb.x - 12, bomb.y - 12, 24, 24);

          ctx.fillStyle = '#000000';
          ctx.font = 'bold 12px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(Math.ceil(bomb.timer), bomb.x, bomb.y);
          ctx.restore();
        });

        // Inimigos (Autômatos: Renderização por Estado, Tier de Profundidade e Barra de Vida)
        room.enemies.forEach(enemy => {
          ctx.save();
          const pulse = (Math.sin(enemy.pulseAngle) + 1) / 2;
          const isFlashing = enemy.flashTimer > 0;

          let renderX = enemy.x;
          let renderY = enemy.y;

          // Sombra projetada
          ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
          ctx.beginPath();
          ctx.ellipse(renderX, renderY + enemy.radius - 2, enemy.radius * 0.9, 4, 0, 0, Math.PI * 2);
          ctx.fill();

          // Cores base por Nível / Tier de Vida
          let bodyColor = '#c62828';
          let strokeColor = '#7f0000';
          let coreColor = `rgba(255, 205, 210, ${0.4 + pulse * 0.4})`;

          if (enemy.maxHp === 2) {
            // Nível 2: Autômato Blindado Ametista (2 HP)
            bodyColor = '#8e24aa';
            strokeColor = '#4a148c';
            coreColor = `rgba(225, 190, 231, ${0.5 + pulse * 0.4})`;
          } else if (enemy.maxHp >= 3) {
            // Nível 3+: Titã Mecânico de Obsidiana e Ouro (3+ HP)
            bodyColor = '#263238';
            strokeColor = '#ffd700';
            coreColor = `rgba(255, 215, 0, ${0.6 + pulse * 0.4})`;
          }

          if (isFlashing) {
            bodyColor = '#ffffff';
            strokeColor = '#ef5350';
          }

          if (enemy.state === 'dormant') {
            // Estado Carência / Inicialização na entrada da sala
            ctx.fillStyle = isFlashing ? '#ffffff' : '#455a64';
            ctx.beginPath();
            ctx.arc(renderX, renderY, enemy.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = enemy.maxHp >= 3 ? 3 : 2;
            ctx.stroke();

            // Núcleo ótico desligado / pulsando fraco
            ctx.fillStyle = `rgba(144, 164, 174, ${0.3 + pulse * 0.3})`;
            ctx.beginPath();
            ctx.arc(renderX, renderY, 4, 0, Math.PI * 2);
            ctx.fill();

            // Ícone de boot / dormindo
            ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.font = 'bold 9px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText('zzz', renderX, renderY - enemy.radius - 2);
          } else if (enemy.state === 'alert') {
            // Estado Alerta / Retardo de Reação: Vibrando engrenagens antes de atacar!
            const shake = (Math.random() - 0.5) * 3;
            renderX += shake;

            ctx.fillStyle = isFlashing ? '#ffffff' : (enemy.maxHp >= 3 ? '#ff6f00' : (enemy.maxHp === 2 ? '#ab47bc' : '#ff8f00'));
            ctx.beginPath();
            ctx.arc(renderX, renderY, enemy.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = enemy.maxHp >= 3 ? 3 : 2.5;
            ctx.stroke();

            // Núcleo ótico amarelo incandescente
            ctx.fillStyle = '#fff59d';
            ctx.beginPath();
            ctx.arc(renderX, renderY, 6, 0, Math.PI * 2);
            ctx.fill();

            // Balão de Alerta com "!" acima do autômato
            const bobY = Math.sin(now * 12) * 2;
            ctx.save();
            ctx.fillStyle = '#ffca28';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(renderX, renderY - enemy.radius - 12 + bobY, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#000000';
            ctx.font = 'bold 11px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('!', renderX, renderY - enemy.radius - 12 + bobY);
            ctx.restore();
          } else if (enemy.state === 'chase') {
            // Perseguição ativa
            ctx.fillStyle = isFlashing ? '#ffffff' : (enemy.maxHp >= 3 ? '#37474f' : (enemy.maxHp === 2 ? '#7b1fa2' : '#ef5350'));
            ctx.beginPath();
            ctx.arc(renderX, renderY, enemy.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = enemy.maxHp >= 3 ? 3 : 2.5;
            ctx.stroke();

            // Núcleo ótico agressivo pulsante
            ctx.fillStyle = coreColor;
            ctx.beginPath();
            ctx.arc(renderX, renderY, 5.5, 0, Math.PI * 2);
            ctx.fill();
          } else {
            // Patrulha / Idle
            ctx.fillStyle = isFlashing ? '#ffffff' : bodyColor;
            ctx.beginPath();
            ctx.arc(renderX, renderY, enemy.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = enemy.maxHp >= 3 ? 3 : 2;
            ctx.stroke();

            ctx.fillStyle = coreColor;
            ctx.beginPath();
            ctx.arc(renderX, renderY, 4, 0, Math.PI * 2);
            ctx.fill();
          }

          // Barra de Vida e Segmentos de Blindagem para Inimigos com 2+ HP
          if (enemy.maxHp > 1) {
            const barW = 24;
            const barH = 4;
            const barX = renderX - barW / 2;
            const barY = renderY - enemy.radius - (enemy.state === 'alert' ? 24 : 10);

            // Fundo escuro da barra
            ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);

            // Preenchimento de HP restante
            const hpRatio = Math.max(0, enemy.hp / enemy.maxHp);
            ctx.fillStyle = hpRatio > 0.5 ? '#00e676' : (hpRatio > 0.25 ? '#ffca28' : '#ef5350');
            ctx.fillRect(barX, barY, barW * hpRatio, barH);

            // Divisórias dos segmentos de HP
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.65)';
            ctx.lineWidth = 1;
            for (let s = 1; s < enemy.maxHp; s++) {
              const divX = barX + (barW / enemy.maxHp) * s;
              ctx.beginPath();
              ctx.moveTo(divX, barY);
              ctx.lineTo(divX, barY + barH);
              ctx.stroke();
            }
          }

          ctx.restore();
        });

        // Cristais de Chrono Core (CC) caídos no chão
        this.ccDrops.forEach(drop => drop.draw(ctx));

        // Jogador (Charlotte: Sprite Animado 64x64 com fallback)
        ctx.save();
        if (this.player.invulnerableTimer > 0 && Math.floor(now * 15) % 2 === 0) {
          ctx.globalAlpha = 0.4;
        }

        // Sombra suave sob os pés
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.beginPath();
        ctx.ellipse(this.player.x, this.player.y + 13, 14, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        if (this.charlloteSprite && this.charlloteSprite.complete && this.charlloteSprite.naturalWidth > 0) {
          let row = 0; // 0: idle
          let fps = 8;
          let totalFrames = 10;

          if (this.player.animState === 'dash') {
            row = 3; // Dash
            fps = 14;
          } else if (this.player.animState === 'throw') {
            row = 4; // Throw
            fps = 12;
          } else if (this.player.animState === 'walk') {
            row = 1; // Walk
            fps = 10;
          } else {
            row = 0; // Idle
            fps = 8;
          }

          let frameIdx = Math.floor(this.player.animTimer * fps) % totalFrames;
          if (this.player.animState === 'throw' && this.input.isAiming) {
            frameIdx = 3; // Mantém postura de mira com bomba em mãos
          }

          ctx.save();
          ctx.translate(this.player.x, this.player.y);
          // Espelha horizontalmente quando olha para a esquerda
          if (this.player.facingSide === -1) {
            ctx.scale(-1, 1);
          }
          // Desenha frame 64x64 centrado nos pés (âncora Y=60 na célula -> offset -44)
          ctx.drawImage(
            this.charlloteSprite,
            frameIdx * 64, row * 64, 64, 64,
            -32, -44, 64, 64
          );
          ctx.restore();
        } else {
          // Fallback gracioso
          ctx.fillStyle = '#29b6f6';
          ctx.beginPath();
          ctx.arc(this.player.x, this.player.y, this.player.radius, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = '#0288d1';
          ctx.lineWidth = 2.5;
          ctx.stroke();

          const eyeX = this.player.x + this.player.facing.dx * 8;
          const eyeY = this.player.y + this.player.facing.dy * 8;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(eyeX, eyeY, 4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        // Renderiza Bombas em Voo (Arremessadas)
        this.flyingBombs.forEach(b => b.draw(ctx));

        // Partículas e Efeitos de Explosão
        this.particles.forEach(p => p.draw(ctx));
        this.blasts.forEach(b => b.draw(ctx));

        // Textos Flutuantes de Notificação (+1 CC, Depósito na Goela, etc.)
        this.floatingTexts.forEach(ft => {
          const alpha = Math.max(0, Math.min(1, ft.life / ft.maxLife));
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.font = 'bold 12px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.strokeStyle = '#000000';
          ctx.lineWidth = 3;
          ctx.strokeText(ft.text, ft.x, ft.y);
          ctx.fillStyle = ft.color;
          ctx.fillText(ft.text, ft.x, ft.y);
          ctx.restore();
        });

        // Feedback Visual de Mira e Trajetória ao Clicar e Arraste para Jogar Bomba
        if (this.input.isAiming) {
          const maxRange = this.player.getThrowRange();
          const aim = this.input.getClampedAimTarget(this.player.x, this.player.y, maxRange);
          if (aim) {
            ctx.save();
            const sx = this.player.x;
            const sy = this.player.y;
            const tx = aim.targetX;
            const ty = aim.targetY;
            const bombType = this.input.selectedBomb;

            // Círculo de alcance máximo permitido pela Manopla Mecânica
            ctx.beginPath();
            ctx.arc(sx, sy, maxRange, 0, Math.PI * 2);
            ctx.strokeStyle = aim.isMax ? 'rgba(255, 82, 82, 0.55)' : 'rgba(255, 255, 255, 0.25)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.setLineDash([]);

            let themeColor = '#ff5252';
            if (bombType === BOMB_TYPE.PROPULSOR) themeColor = '#00e5ff';
            if (bombType === BOMB_TYPE.TIMED) themeColor = '#ffca28';

            // Arco parabólico de mira
            const midX = (sx + tx) / 2;
            const midY = (sy + ty) / 2 - 35;

            ctx.strokeStyle = themeColor;
            ctx.lineWidth = 2.5;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.quadraticCurveTo(midX, midY, tx, ty);
            ctx.stroke();
            ctx.setLineDash([]);

            // Pontos luminosos no arco
            for (let t = 0.25; t <= 0.75; t += 0.25) {
              const px = (1 - t) * (1 - t) * sx + 2 * (1 - t) * t * midX + t * t * tx;
              const py = (1 - t) * (1 - t) * sy + 2 * (1 - t) * t * midY + t * t * ty;
              ctx.fillStyle = '#ffffff';
              ctx.beginPath();
              ctx.arc(px, py, 3, 0, Math.PI * 2);
              ctx.fill();
            }

            // Retículo no ponto de aterrissagem
            ctx.fillStyle = themeColor;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;

            if (bombType === BOMB_TYPE.IMPACT) {
              ctx.beginPath();
              ctx.arc(tx, ty, TILE_SIZE * 0.9, 0, Math.PI * 2);
              ctx.strokeStyle = themeColor;
              ctx.stroke();

              ctx.beginPath();
              ctx.arc(tx, ty, 6, 0, Math.PI * 2);
              ctx.fill();
            } else if (bombType === BOMB_TYPE.PROPULSOR) {
              ctx.beginPath();
              ctx.arc(tx, ty, TILE_SIZE * 1.4, 0, Math.PI * 2);
              ctx.strokeStyle = 'rgba(0, 229, 255, 0.6)';
              ctx.stroke();

              ctx.beginPath();
              ctx.arc(tx, ty, 6, 0, Math.PI * 2);
              ctx.fill();
            } else {
              const arm = TILE_SIZE * 1.2;
              ctx.strokeStyle = themeColor;
              ctx.lineWidth = 3;
              ctx.beginPath();
              ctx.moveTo(tx - arm, ty);
              ctx.lineTo(tx + arm, ty);
              ctx.moveTo(tx, ty - arm);
              ctx.lineTo(tx, ty + arm);
              ctx.stroke();

              ctx.beginPath();
              ctx.arc(tx, ty, 6, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.restore();
          }
        } else if (this.input.mousePos && this.input.mousePos.active) {
          // Mira sutil do cursor do mouse
          ctx.save();
          const mx = this.input.mousePos.x;
          const my = this.input.mousePos.y;
          ctx.strokeStyle = 'rgba(41, 182, 246, 0.35)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(mx, my, 7, 0, Math.PI * 2);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(mx - 10, my);
          ctx.lineTo(mx + 10, my);
          ctx.moveTo(mx, my - 10);
          ctx.lineTo(mx, my + 10);
          ctx.stroke();
          ctx.restore();
        }

        // Efeito Glitch de Rebobinar o Tempo
        if (this.rewindGlitchTimer > 0) {
          ctx.save();
          ctx.fillStyle = 'rgba(0, 229, 255, 0.25)';
          ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
          ctx.fillStyle = 'rgba(255, 23, 68, 0.25)';
          ctx.fillRect(Math.random() * 8 - 4, Math.random() * 8 - 4, WORLD_WIDTH, WORLD_HEIGHT);
          ctx.restore();
        }

        // Fade Out / In
        if (this.fadeAlpha > 0) {
          ctx.save();
          ctx.fillStyle = `rgba(12, 14, 18, ${this.fadeAlpha})`;
          ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
          ctx.restore();
        }

        this.renderMinimap();
      }

      renderMinimap() {
        const mctx = this.miniCtx;
        mctx.clearRect(0, 0, 70, 70);

        const current = this.map.currentRoom;
        const cell = 12;
        const margin = 5;

        for (let y = 0; y < this.map.mapSize; y++) {
          for (let x = 0; x < this.map.mapSize; x++) {
            const room = this.map.rooms.get(`${x},${y}`);
            if (room && room.visited) {
              const mx = margin + x * cell;
              const my = margin + y * cell;

              if (room === current) {
                mctx.fillStyle = '#29b6f6';
              } else if (room.cleared) {
                mctx.fillStyle = '#455a64';
              } else {
                mctx.fillStyle = '#c62828';
              }

              mctx.fillRect(mx, my, cell - 2, cell - 2);

              if (room.hasGoela) {
                mctx.fillStyle = '#4caf50';
                mctx.fillRect(mx + cell / 2 - 2, my + cell / 2 - 2, 3, 3);
              }
            }
          }
        }
      }

      updateHUD() {
        const room = this.map.currentRoom;
        const coordsEl = document.getElementById('room-coords');
        const enemyEl = document.getElementById('enemy-counter');
        const lockdownBanner = document.getElementById('lockdown-banner');

        const depth = this.map.currentDepth || 1;
        if (room.isSecret) {
          coordsEl.textContent = `ANDAR SECRETO • NÍVEL ${depth}`;
        } else {
          coordsEl.textContent = `NÍVEL ${depth} • SALA [${room.rx}, ${room.ry}]`;
        }

        enemyEl.textContent = `INIMIGOS: ${room.enemies.length}`;
        if (room.enemies.length > 0) {
          enemyEl.className = 'status-alert';
        } else {
          enemyEl.className = 'status-ok';
        }

        if (room.isLockdown) {
          lockdownBanner.style.display = 'block';
        } else {
          lockdownBanner.style.display = 'none';
        }

        const gauntletEl = document.getElementById('gauntlet-level');
        if (gauntletEl) {
          gauntletEl.textContent = this.player.getGauntletTitle();
        }

        const ccEl = document.getElementById('cc-counter');
        if (ccEl) {
          ccEl.textContent = `${this.player.chronoCores || 0} CC`;
        }
      }
    }

    // --------------------------------------------------------------------------
    // TOAST NOTIFIER HELPER
    // --------------------------------------------------------------------------
    let toastTimeout = null;
    function showToast(msg) {
      const el = document.getElementById('center-toast');
      el.textContent = msg;
      el.classList.add('visible');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        el.classList.remove('visible');
      }, 1600);
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.game = new GameEngine();

      // Botão HUD da Manopla para clique/toque direto de upgrade
      const gauntletBadge = document.getElementById('gauntlet-badge');
      if (gauntletBadge) {
        gauntletBadge.addEventListener('click', (e) => {
          e.preventDefault();
          sound.init();
          if (window.game) {
            window.game.player.upgradeGauntlet();
            window.game.updateHUD();
            window.game.spawnSparks(window.game.player.x, window.game.player.y, '#ffd700', 30);
          }
        });
      }
    });
  </script>
</body>
</html>
